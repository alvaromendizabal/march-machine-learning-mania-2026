name: Apply reviewed Champions Edition
on:
  push:
    branches: [publication/duke-michigan-champions-20261015]
    paths: ['.github/champions-transfer/**']
permissions:
  contents: write
jobs:
  apply-public-source:
    if: github.repository == 'alvaromendizabal/march-machine-learning-mania-2026' && startsWith(github.event.head_commit.message, 'Stage reviewed Champions')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify and apply the exact reviewed public source
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path
          branch='publication/duke-michigan-champions-20261015'
          base='a484e3f4e2bbca7c36d8030584568c77c91986e9'
          def run(*args): subprocess.run(args,check=True)
          if os.environ.get('GITHUB_REF')!='refs/heads/'+branch:
              raise SystemExit('Unexpected branch')
          if subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()!=base:
              raise SystemExit('Reviewed base changed')
          encoded=''.join(Path(f'.github/champions-transfer/part{i}.txt').read_text().strip() for i in (1,2))
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          if len(raw)!=53968 or hashlib.sha256(raw).hexdigest()!='22ad5d5a1f32396ff7f7e9265f887a4c34ddb299672dc94dc478b7658399918d':
              raise SystemExit('Reviewed source integrity failed')
          allowed=set('README.md START_HERE.md docs/assets/forecasting-system.svg docs/champion_result.md docs/current_research.md docs/model_card.md docs/public_demo.md docs/reviewer_contract.md docs/scouting_walkthrough.md portfolio/DISCLOSURE.md portfolio/review_snapshot.json public-demo/app.js public-demo/data.js public-demo/engine.js public-demo/index.html public-demo/styles.css reports/champion_result/kaggle_record.json tools/test_demo_package.py tools/test_public_demo.mjs tools/test_public_demo_engine.mjs'.split())
          entries=json.loads(raw)
          if len(entries)!=20 or {e['path'] for e in entries}!=allowed:
              raise SystemExit('Unexpected public paths')
          for e in entries:
              p=Path(e['path'])
              if p.is_symlink(): raise SystemExit('Symlink rejected')
              if e['before'] is None:
                  if p.exists(): raise SystemExit('New file exists: '+str(p))
                  old=b''
              else:
                  old=p.read_bytes()
                  if hashlib.sha256(old).hexdigest()!=e['before']: raise SystemExit('Base mismatch: '+str(p))
              lines=old.decode('utf-8').splitlines(keepends=True)
              for a,b,content in reversed(e['ops']):
                  if not 0<=a<=b<=len(lines): raise SystemExit('Invalid line operation')
                  lines[a:b]=[content]
              out=''.join(lines).encode('utf-8')
              if hashlib.sha256(out).hexdigest()!=e['after']: raise SystemExit('Final mismatch: '+str(p))
              p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(out)
          run('python','tools/check_public_demo.py')
          run('python','tools/package_public_demo.py')
          run('python','-m','unittest','discover','-s','tools','-p','test_demo_package.py')
          run('python','-m','unittest','discover','-s','tools','-p','test_public*.py')
          run('node','tools/test_public_demo_engine.mjs')
          run('node','tools/test_public_demo.mjs')
          run('python','tools/reproduce_public.py','--check')
          run('python','portfolio/reproduce_release.py','--check')
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','add','--',*sorted(allowed))
          run('git','rm','-r','--','.github/champions-transfer')
          run('git','commit','-m','Build Duke and Michigan Champions Edition with recorded Kaggle result')
          run('python','tools/check_publication.py','--base',base,'--head','HEAD')
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          if changed!=allowed|{'.github/workflows/apply-champions.yml'}: raise SystemExit('Unexpected public diff')
          # This bot does not edit workflows. The authorized repository connection
          # removes this temporary workflow before the normal public PR is opened.
          run('git','push','origin','HEAD:refs/heads/'+branch)
          print('CHAMPIONS_SOURCE_APPLIED',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
