name: Notebook research
on:
  workflow_dispatch:
  push:
    branches: [feat/notebook-research]
    paths:
      - '.github/workflows/notebooks.yml'
      - 'src/march_mania/modeling.py'
      - 'src/march_mania/publication/workflow.py'
      - 'src/march_mania/publication/artifacts.py'
      - 'configs/model_comparison.json'
permissions:
  contents: read
concurrency:
  group: notebook-research
  cancel-in-progress: false
jobs:
  research:
    if: github.repository == 'alvaromendizabal/march-machine-learning-mania-2026' && (github.ref == 'refs/heads/feat/notebook-research' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
    env:
      AWS_DEFAULT_REGION: us-west-2
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.33'
          python-version: '3.12.13'
          enable-cache: true
      - name: Import the locally validated canonical research source once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv sync --locked --group dev
          uv run --locked python - <<'PYCODE'
          import base64
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          import nbformat

          BLOBS = ['e6eabbd14dad555ab16069e8c8ec13493a63647a', '74de57d9e4d62f5e998bf7014801dc0256a65bda', '9a3aadd740c2581f4f075ab4411ae123f6985eeb', '3c80660a886dca716287faf15e12c7a57ce64d66', '84147d178bed25345eb6e07283d326da10b1ad12', '540db3d8e5ba6e15ff4e6a175cd056c967f0262b', '247f61aa4ea81fac8d774333829bcae08b7b39e8', '57445f6b435329540a5acea6dde9f6662ca12183']
          DIGEST = '9377028093cd277e9d1f08db401b8c3797c12c13b22c69b241eadd982ec4c95a'
          BASE = 'd46a458f703bff7f0b47a4d1a82173fd07830409'


          def apply(root, packed):
              if hashlib.sha256(packed).hexdigest() != DIGEST:
                  raise ValueError('Source transport digest mismatch')
              manifest = json.loads(gzip.decompress(packed))
              if manifest['schema'] != 1 or manifest['base'] != BASE:
                  raise ValueError('Unexpected source base or schema')
              prepared = {}
              for entry in manifest['files']:
                  relative = Path(entry['path'])
                  if relative.is_absolute() or '..' in relative.parts or relative.parts[0] not in {'.gitattributes', 'README.md', 'notebooks', 'scripts', 'src', 'tests'}:
                      raise ValueError('Source path outside allowlist')
                  path = root / relative
                  if path.is_symlink() or relative.as_posix() in prepared:
                      raise ValueError('Duplicate or symlink source path')
                  old = path.read_bytes() if path.exists() else b''
                  actual = hashlib.sha256(old).hexdigest() if path.exists() else None
                  if actual != entry['before']:
                      raise ValueError('Source changed before import: ' + entry['path'])
                  if 'notebook' in entry:
                      notebook = nbformat.reads(old.decode(), as_version=4)
                      spec = entry['notebook']
                      if 'replace_cells' in spec:
                          notebook.cells = [nbformat.from_dict(cell) for cell in spec['replace_cells']]
                      else:
                          for index, source in spec['cells'].items():
                              notebook.cells[int(index)].source = source
                      for cell in notebook.cells:
                          if cell.cell_type == 'code':
                              cell.execution_count = None
                              cell.outputs = []
                              cell.metadata.pop('execution', None)
                      new = (nbformat.writes(notebook) + '\n').encode()
                  else:
                      lines = old.decode().splitlines(keepends=True)
                      for edit in reversed(entry['edits']):
                          lines[edit['start']:edit['end']] = edit['lines']
                      new = ''.join(lines).encode()
                  if hashlib.sha256(new).hexdigest() != entry['sha256']:
                      raise ValueError('Source output digest mismatch: ' + entry['path'])
                  prepared[relative.as_posix()] = (path, new)
              for path, new in prepared.values():
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(new)
              return sorted(prepared)


          if __name__ == '__main__':
              root = Path.cwd()
              def git(*args):
                  return subprocess.check_output(['git', *args], text=True).strip()
              branch = 'feat/notebook-research'
              if os.environ['GITHUB_REF'] != 'refs/heads/' + branch or git('status', '--porcelain'):
                  raise ValueError('Import requires the clean authorized research checkout')
              git('fetch', 'origin', branch)
              if git('rev-parse', 'HEAD') != git('rev-parse', 'origin/' + branch):
                  raise ValueError('Remote advanced before source import')
              subprocess.run(['git', 'merge-base', '--is-ancestor', BASE, 'HEAD'], check=True)
              chunks = []
              for sha in BLOBS:
                  request = urllib.request.Request('https://api.github.com/repos/alvaromendizabal/march-machine-learning-mania-2026/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json'})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      item = json.load(response)
                  chunk = base64.b64decode(item['content'])
                  if hashlib.sha1(('blob ' + str(len(chunk)) + '\0').encode() + chunk).hexdigest() != sha:
                      raise ValueError('Git source blob mismatch')
                  chunks.append(chunk)
              paths = apply(root, b''.join(chunks))
              git('config', 'user.name', 'github-actions[bot]')
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              git('add', '--', *paths)
              git('commit', '-m', 'feat: expand domain feature research with training-only screening', '-m', 'Add 3,090 leakage-safe candidates, coach history, fold-level screening audits, bounded-memory resumable feature artifacts, and verified notebook publication. Preserve prior completed experiment history and user-controlled submission generation.')
              git('push', 'origin', 'HEAD:refs/heads/' + branch)
              print(json.dumps({'event': 'verified_source_published', 'commit': git('rev-parse', 'HEAD'), 'files': len(paths), 'transport_sha256': DIGEST}))
          PYCODE
      - name: Validate the exact source before using private data
        run: |
          mkdir -p outputs/validation
          git rev-parse HEAD > outputs/validation/source_commit.txt
          git archive --format=zip --output=outputs/validation/source.zip HEAD
          sha256sum outputs/validation/source.zip > outputs/validation/source.sha256
          uv sync --locked --group dev
          uv run --locked python scripts/quality.py
      - name: Use the existing restricted artifact role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::560403859723:role/march-mania-inference
          role-session-name: march-notebook-research
          aws-region: us-west-2
          allowed-account-ids: '560403859723'
          role-duration-seconds: 3600
      - name: Execute notebook 02 with real feature generation and ablation fits
        env:
          MARCH_NOTEBOOK_MODE: train
        run: |
          uv run --locked python -m ipykernel install --user --name march-mania
          uv run --locked python -c "from pathlib import Path; from march_mania.publication.notebooks import NOTEBOOKS, execute_notebooks; execute_notebooks(Path.cwd(), names=(NOTEBOOKS[2],), publish=True, timeout=5400)"
      - name: Refresh credentials before the independent model phase
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::560403859723:role/march-mania-inference
          role-session-name: march-notebook-models
          aws-region: us-west-2
          allowed-account-ids: '560403859723'
          role-duration-seconds: 3600
      - name: Execute notebook 03 with actual retraining on notebook 02 artifacts
        env:
          MARCH_NOTEBOOK_MODE: train
        run: uv run --locked python -c "from pathlib import Path; from march_mania.publication.notebooks import NOTEBOOKS, execute_notebooks; execute_notebooks(Path.cwd(), names=(NOTEBOOKS[3],), publish=True, timeout=5400)"
      - name: Refresh the existing short-lived artifact session
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::560403859723:role/march-mania-inference
          role-session-name: march-notebook-verification
          aws-region: us-west-2
          allowed-account-ids: '560403859723'
          role-duration-seconds: 3600
      - name: Prove fresh-directory model recovery without repeating fits
        run: uv run --locked python -W error -m march_mania.publication.workflow --verify-recovery
      - name: Publish readable review outputs and verify notebook reuse
        run: |
          uv run --locked python scripts/notebook.py --execute --publish
          uv run --locked python scripts/notebook.py --execute --publish
          test ! -e submissions/submission.csv
          cp -r reports/model_comparison outputs/validation/model_comparison
          cp -r reports/feature_store outputs/validation/feature_store
          cp outputs/notebook_workflow/events.jsonl outputs/validation/research.jsonl
      - name: Commit only executed notebooks and public research evidence
        if: github.ref == 'refs/heads/feat/notebook-research'
        run: uv run --locked python -m march_mania.publication.git --source "$(cat outputs/validation/source_commit.txt)"
      - name: Preserve exact validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: notebook-research-validation
          path: outputs/validation/
          retention-days: 90
