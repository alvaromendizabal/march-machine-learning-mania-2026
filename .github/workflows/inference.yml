name: Final predictions
on:
  workflow_dispatch:
  push:
    branches: [feat/final-predictions]
    paths:
      - src/march_mania/publication/inference.py
      - src/march_mania/publication/artifacts.py
      - configs/inference.json
      - .github/workflows/inference.yml
permissions:
  contents: read
concurrency:
  group: final-predictions
  cancel-in-progress: false
jobs:
  inference:
    if: github.repository == 'alvaromendizabal/march-machine-learning-mania-2026' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/final-predictions')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEFAULT_REGION: us-west-2
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.33'
          python-version: '3.12.13'
          enable-cache: true
      - name: Validate the exact locked source
        run: |
          mkdir -p outputs/validation
          git rev-parse HEAD > outputs/validation/source_commit.txt
          git archive --format=zip --output=outputs/validation/source.zip HEAD
          sha256sum outputs/validation/source.zip > outputs/validation/source.sha256
          uv sync --locked --group dev
          uv run --locked python scripts/quality.py
      - name: Use repository-scoped temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::560403859723:role/march-mania-inference
          aws-region: us-west-2
          role-session-name: march-${{ github.run_id }}
          allowed-account-ids: '560403859723'
          role-duration-seconds: 3600
      - name: Fit, evaluate, predict, and preserve each completed task
        run: |
          uv run --locked python -W error -m march_mania.publication.inference \
            --download-inputs \
            --s3 s3://sagemaker-march-mania-560403859723-us-west-2/final-predictions
      - name: Verify recovery in a fresh local run directory
        run: |
          uv run --locked python -W error -m march_mania.publication.inference \
            --run-root outputs/resume_verification \
            --s3 s3://sagemaker-march-mania-560403859723-us-west-2/final-predictions
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          from march_mania.runtime import atomic_json, digest
          base = Path('outputs/resume_verification')
          pointer = json.loads((base / 'latest.json').read_text())
          run = base / pointer['directory']
          events = [json.loads(line) for line in (run / 'events.jsonl').read_text().splitlines()]
          assert not any(e['event'] == 'task_started' for e in events), 'Recovery repeated work'
          restored = sum(e['event'] == 'task_restored' for e in events)
          reused = sum(e['event'] == 'task_reused' for e in events)
          assert restored == reused and restored > 20
          original = Path('outputs/final_predictions') / pointer['directory']
          assert digest(run / 'publication/submission.csv') == digest(original / 'publication/submission.csv')
          proof = {'status': 'passed', 'restored_tasks': restored, 'reused_tasks': reused,
                   'repeated_fits': 0, 'identical_submission': True, 'fingerprint': pointer['fingerprint']}
          atomic_json(Path('reports/final_predictions/resume.json'), proof)
          print(json.dumps(proof))
          PY
      - name: Execute notebooks and retain the prediction deliverable
        run: |
          uv run --locked python -m ipykernel install --user --name march-mania
          uv run --locked python scripts/notebook.py --execute --publish
          mkdir -p outputs/validation/final
          cp -r reports/final_predictions outputs/validation/final/reports
          uv run --locked python - <<'PY'
          import json, shutil
          from pathlib import Path
          base = Path('outputs/final_predictions')
          key = json.loads((base/'latest.json').read_text())['directory']
          shutil.copy2(base/key/'publication/submission.csv', 'outputs/validation/final/submission.csv')
          shutil.copy2(base/key/'events.jsonl', 'outputs/validation/final/events.jsonl')
          PY
      - name: Preserve reviewable evidence, never raw data or fitted binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: final-prediction-validation
          path: outputs/validation/
          retention-days: 90
