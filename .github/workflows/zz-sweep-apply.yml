name: Apply reviewed repository curation
on:
  push:
    branches: [maintenance/portfolio-sweep-20261019]
    paths: [.github/workflows/zz-sweep-apply.yml]
permissions:
  contents: write
jobs:
  curate:
    if: github.repository == 'alvaromendizabal/march-machine-learning-mania-2026'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply dependency-reviewed legacy retirement
        run: |
          python3 .cleanup/curate.py
          git rm -rf .cleanup
          python3 -B -S tools/reproduce_public.py --check
          python3 -B -S portfolio/reproduce_release.py --check
          python3 -B -S tools/summarize_execution.py --check
      - name: Publish only source changes, never workflow changes, to the review branch
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep '^.github/workflows/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Retire unreferenced legacy exports and one-time consolidation tooling'
          git push origin HEAD:maintenance/portfolio-sweep-20261019
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/commit.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: curated-source
          path: |
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/commit.txt
          retention-days: 3
          if-no-files-found: error
