name: Research quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  notebook-publication:
    # Produce reviewable native outputs promptly; the independent quality gate remains required.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.33'
          python-version: '3.12.13'
          enable-cache: true
      - name: Execute canonical notebooks with the locked environment
        run: |
          uv sync --locked --group dev
          mkdir -p outputs/validation
          git rev-parse HEAD > outputs/validation/source_commit.txt
          uv run --locked python -m ipykernel install --user --name march-mania
          uv run --locked python scripts/notebook.py --execute --publish
          uv run --locked python scripts/notebook.py --execute --publish
      - name: Preserve native publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notebook-publication
          path: outputs/validation/
          retention-days: 90
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record exact source under validation
        run: |
          mkdir -p outputs/validation
          git rev-parse HEAD > outputs/validation/source_commit.txt
          git archive --format=zip --output=outputs/validation/source.zip HEAD
          sha256sum outputs/validation/source.zip > outputs/validation/source.sha256
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.33'
          python-version: '3.12.13'
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --group dev
      - name: Preserve portable offline audit tools
        if: github.head_ref == 'feat/notebook-research'
        run: |
          uvx --from pip==25.2 pip download --only-binary=:all: --python-version 313 --implementation cp --abi cp313 --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 --dest outputs/validation/wheels ruff==0.13.3 mypy==1.18.2 pyarrow==21.0.0
          uvx --from pip==25.2 pip download --no-deps --dest outputs/validation/wheels pandas-stubs==2.3.2.250926 types-pytz==2026.3.1.20260727
          sha256sum outputs/validation/wheels/* > outputs/validation/wheels.sha256
      - name: Compile, lint, format, type check, and test
        run: uv run --locked python scripts/quality.py
      - name: Verify current published research release
        run: uv run --locked python -m march_mania.publication.release --check
      - name: Recompute the development prediction portfolio
        run: uv run --locked python -m march_mania.publication.portfolio --check
      - name: Verify frozen production recipes and published prediction evidence
        run: uv run --locked python -m march_mania.publication.production_release --check
      - name: Verify observed scores and historical refinement evidence
        run: uv run --locked python -m march_mania.publication.refinement --check
      - name: Verify the complete score ledger and bounded retraining evidence
        run: |
          uv run --locked python -m march_mania.publication.scoreboard --check
          uv run --locked python -m march_mania.publication.retraining --check
          uv run --locked python -m march_mania.publication.challengers --check
          uv run --locked python scripts/women_challengers.py --check
          uv run --locked python scripts/final_report.py --check
      - name: Execute and preserve current notebooks
        # Collect native outputs for proposed publications even if their old receipt is stale.
        # Earlier failed gates still fail the job; no failed check is waived.
        if: ${{ !cancelled() }}
        run: |
          uv run --locked python -m ipykernel install --user --name march-mania
          uv run --locked python scripts/notebook.py --execute --publish
          uv run --locked python scripts/notebook.py --execute --publish
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: research-validation
          path: outputs/validation/
          retention-days: 90
