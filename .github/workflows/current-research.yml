name: Current research evidence
on:
  push:
    branches: [main, publication/scored-update-20260922]
  pull_request:
permissions:
  contents: read
concurrency:
  group: current-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/publication/scored-update-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: publication/scored-update-20260922
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.33'
          python-version: '3.12.13'
          enable-cache: true
      - name: Execute aggregate report only
        run: |
          uv sync --locked --group dev
          uv run --locked python -m ipykernel install --user --name march-portfolio
          uv run --locked python -m unittest discover -s portfolio -p 'test_current_research.py' -v
          uv run --locked python portfolio/current_research.py --build --kernel march-portfolio
          uv run --locked python portfolio/current_research.py --check
      - name: Commit allowlisted generated evidence to the publication branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PY'
          import subprocess
          allowed = ['portfolio/current_research.ipynb','reports/current_research/publication.json'] + ['reports/current_research/figures/'+n+'.png' for n in ['scored','screen','pooled','years','seeds','ablation','women','women_years']]
          subprocess.run(['git','add','-f','--',*allowed],check=True)
          paths = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths and set(paths) <= set(allowed), paths
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Execute scored research case study with women transfer evidence'
          git push origin HEAD:refs/heads/publication/scored-update-20260922
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.33'
          python-version: '3.12.13'
          enable-cache: true
      - name: Verify saved output and clean-kernel reproduction
        run: |
          uv sync --locked --group dev
          uv run --locked python -m unittest discover -s portfolio -p 'test_current_research.py' -v
          uv run --locked python portfolio/current_research.py --check
          uv run --locked python -m ipykernel install --user --name march-portfolio
          uv run --locked python portfolio/current_research.py --build --kernel march-portfolio
          uv run --locked python portfolio/current_research.py --check
