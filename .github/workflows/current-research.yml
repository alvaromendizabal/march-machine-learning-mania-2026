name: Current research evidence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: current-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.33'
          python-version: '3.12.13'
          enable-cache: true
      - name: Check saved evidence and re-execute with clean kernels
        run: |
          uv sync --locked --group dev
          uv run --locked python -m march_mania.publication.portfolio_contract

          uv run --locked python -m unittest discover -s portfolio -p 'test_current_research.py' -v
          uv run --locked python portfolio/current_research.py --check
          uv run --locked python -m ipykernel install --user --name march-portfolio
          uv run --locked python portfolio/current_research.py --build --kernel march-portfolio
          uv run --locked python portfolio/current_research.py --check

          uv run --locked python -m unittest discover -s tools -p 'test_review_project.py' -v
          uv run --locked python -m unittest discover -s tools -p 'test_owner_replay.py' -v
          uv run --locked python -m unittest discover -s tools -p 'test_evidence_history.py' -v
          uv run --locked python tools/evidence_history.py --check
          uv run --locked python -m unittest discover -s tools -p 'test_qualification_frontier.py' -v
          uv run --locked python tools/qualification_frontier.py --check
          node tools/test_qualification_frontier.mjs
          uv run --locked python tools/review_project.py --build-notebook --kernel march-portfolio

          uv run --locked python -m unittest discover -s portfolio -p 'test_frontier_research.py' -v
          uv run --locked python portfolio/frontier_research.py --check
          uv run --locked python -m ipykernel install --user --name march-frontier
          uv run --locked python portfolio/frontier_research.py --build --kernel march-frontier
          uv run --locked python portfolio/frontier_research.py --check
