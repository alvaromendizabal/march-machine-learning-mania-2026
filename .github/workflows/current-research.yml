name: Current research evidence
on:
  push:
    branches: [main, publication/current-research-20260921]
  pull_request:
permissions:
  contents: read
concurrency:
  group: current-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/publication/current-research-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: publication/current-research-20260921
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.33'
          python-version: '3.12.13'
          enable-cache: true
      - name: Execute aggregate report only
        run: |
          uv sync --locked --group dev
          uv run --locked python -m ipykernel install --user --name march-portfolio
          uv run --locked python -m unittest discover -s portfolio -p 'test_current_research.py' -v
          uv run --locked python portfolio/current_research.py --build --kernel march-portfolio
          uv run --locked python portfolio/current_research.py --check
      - name: Commit only generated publication evidence to the dedicated branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git add -f -- portfolio/current_research.ipynb reports/current_research/publication.json reports/current_research/figures/scored.png reports/current_research/figures/screen.png reports/current_research/figures/pooled.png reports/current_research/figures/years.png reports/current_research/figures/seeds.png reports/current_research/figures/ablation.png
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          allowed = {'portfolio/current_research.ipynb','reports/current_research/publication.json'} | {'reports/current_research/figures/'+n+'.png' for n in ['scored','screen','pooled','years','seeds','ablation']}
          assert paths and set(paths) <= allowed, paths
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish executed current research notebook and verified figures'
          git push origin HEAD:refs/heads/publication/current-research-20260921
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.33'
          python-version: '3.12.13'
          enable-cache: true
      - name: Verify committed outputs, then re-execute from a clean kernel
        run: |
          uv sync --locked --group dev
          uv run --locked python -m unittest discover -s portfolio -p 'test_current_research.py' -v
          uv run --locked python portfolio/current_research.py --check
          uv run --locked python -m ipykernel install --user --name march-portfolio
          uv run --locked python portfolio/current_research.py --build --kernel march-portfolio
          uv run --locked python portfolio/current_research.py --check
