name: Apply tested Duke showcase source
on:
  push:
    branches: [publication/duke-showcase-20261015]
    paths: ['.github/showcase-transfer/**', .github/workflows/showcase-transfer.yml]
permissions:
  contents: write
jobs:
  apply-reviewed-source:
    if: github.repository == 'alvaromendizabal/march-machine-learning-mania-2026'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Apply and verify the exact public diff; remove this one-time transfer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, os, subprocess, tempfile
          branch = 'publication/duke-showcase-20261015'
          base = '601a66dbe36fdeac3f6be19aeb689a5ff015388c'
          if os.environ.get('GITHUB_REF') != 'refs/heads/' + branch:
              raise SystemExit('Restricted publication branch')
          if subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() != base:
              raise SystemExit('Reviewed base changed')
          expected = {
            '.github/workflows/public-demo.yml': 'a256d5f829767932f0e77d68343339ef7eec757b44b7350a1b50d1443c121454',
            'README.md': '3d2654618d7b24a7248ce12265c012526268347f40580f708a78c71e4a9cdc1d',
            'START_HERE.md': 'a854e0bbf3387f01e416a5b823887a851ae44fc145ac794c4f491f318ffce3b4',
            'docs/assets/forecasting-system.svg': '905598ec9a4df5256fdd929e617f448df46ba96613d63ccc294de922bba33b47',
            'docs/current_research.md': '3c4e5c0e6f3ef4ac721bd5375208c39a927cff81312b4466bb42f7f879f200ea',
            'docs/model_card.md': '7edded3cc258bcdea77dd32af13499e1809fc454208574695fdf1076712c8d04',
            'docs/public_demo.md': '0550b4cc4d8e657c96c63db62c5ea09289609c5794ad91379c080ddde46ddef1',
            'docs/scouting_walkthrough.md': 'ff55f21cba6f7eb60a3b191deaa616e51307f870dfde2b88ca3a3d165d4b1bd6',
            'portfolio/DISCLOSURE.md': 'f19bb46b4ab4e3208a8f19fdf25f3eec9b96b3c5212851c41fe3b6cd0822657c',
            'portfolio/review_snapshot.json': '87a848d74c3059251465c9e73bbbd49cf6a9ab16d3f1cb8fd66d30449857ef90',
            'public-demo/app.js': '893c9beedc6d7ab8521e13d9c5af7738c0e6c994f7029276f63d7bc36f2ea5fb',
            'public-demo/data.js': '929850f80109679746e5a0de81223bc6c6568a0a45c86823a6444c2994efac5d',
            'public-demo/engine.js': '8d902d04d0d2ba62c18d09f9222b9d0674cd16aaeeb9835a0aae06f522d53402',
            'public-demo/index.html': '932d44b1079355667b6521c03d408ba10ead5138c312c80a455a600629cc9958',
            'public-demo/styles.css': 'd21617c519cc28c50a406a0a325629aed5416f966c50ab971391826b9848ac80',
            'tools/package_public_demo.py': 'e145a3a24e59e8b51e136b1977d3ecf232db58bb4033e9cff6d540232f3879b1',
            'tools/test_demo_package.py': '71b82a6991d711e923971c68fe41cbb8abaa56ce420f2a0f3a97938c00cee9e6',
            'tools/test_public_demo.mjs': 'bbe344d52fdd3e042a08087d3016aa08cf9d133d88edd4ff4bc3cdc700af1194',
            'tools/test_public_demo_engine.mjs': 'd9069fe1283929cc44a8790542bb991a5b5dc9c588f58e550dc5964a8d25a8cb'
          }
          encoded = ''.join(Path(f'.github/showcase-transfer/part{i}.txt').read_text().strip() for i in range(1,8))
          patch = gzip.decompress(base64.b64decode(encoded,validate=True))
          if len(patch) != 93187 or hashlib.sha256(patch).hexdigest() != 'c5f8daed3f93aa8f8e0a33724fe5ad76fb28f4195af21b65db977806cd5e410d':
              raise SystemExit('Public diff integrity failed')
          def run(*args): subprocess.run(args,check=True)
          with tempfile.NamedTemporaryFile(suffix='.patch') as stream:
              stream.write(patch); stream.flush()
              run('git','apply','--check',stream.name)
              run('git','apply',stream.name)
          for name, digest in expected.items():
              path=Path(name)
              if path.is_symlink() or not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest()!=digest:
                  raise SystemExit('Tested-source mismatch: '+name)
          run('python','tools/check_public_demo.py')
          run('python','tools/package_public_demo.py')
          run('python','-m','unittest','discover','-s','tools','-p','test_demo_package.py')
          run('node','tools/test_public_demo_engine.mjs')
          run('node','tools/test_public_demo.mjs')
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','add','--',*expected)
          run('git','rm','-r','--','.github/showcase-transfer','.github/workflows/showcase-transfer.yml')
          run('git','commit','-m','Build Duke-centered public forecasting lab and employer review')
          run('python','tools/check_publication.py','--base',base,'--head','HEAD')
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          if changed!=set(expected): raise SystemExit('Unexpected public paths')
          run('git','push','origin','HEAD:refs/heads/'+branch)
          print('PUBLIC_SOURCE_TRANSFER_COMPLETE: 19 exact files; ready for normal PR validation')
          PY
