[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "march-mania-2026"
version = "0.2.0"
description = "Leakage-safe NCAA tournament forecasting project"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6", "pandas==2.3.3", "scipy==1.16.3", "scikit-learn==1.7.2",
  "pyarrow==21.0.0", "PyYAML==6.0.3", "joblib==1.5.2", "plotly==6.3.1",
  "threadpoolctl==3.6.0", "psutil==7.1.0", "filelock==3.20.0", "boto3>=1.40,<2",
]

[project.scripts]
march-research = "march_mania.research:main"

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0", "ruff==0.13.3", "mypy==1.18.2",
       "pandas-stubs==2.3.2.250926", "types-PyYAML==6.0.12.20250915",
       "matplotlib==3.10.7", "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.30.1"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/march_mania/features.py", "src/march_mania/runtime.py",
         "src/march_mania/research.py", "src/march_mania/research_report.py"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
