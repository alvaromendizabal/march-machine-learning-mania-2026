<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d"><title id="t">Tournament Lab — Duke matchup and probability workbench</title><desc id="d">An illustrative public workbench paired with 14,311 research team-season profiles and 132,133 research matchup probabilities. The demo uses synthetic scenarios, not private forecasts.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071b42"/><stop offset="1" stop-color="#173f7b"/></linearGradient></defs><rect width="1280" height="440" rx="16" fill="url(#bg)"/><g fill="none" stroke="#3d6297" opacity=".3"><path d="M785 76h78v64h75m-153 86h78v-64h75m50-22h66v67h80m-246 66h50v-66"/><circle cx="1195" cy="80" r="130"/><circle cx="1195" cy="80" r="80"/></g><text x="52" y="57" fill="#a3c2ff" font-family="system-ui,sans-serif" font-size="16" letter-spacing="3">ALVARO MENDIZABAL / SPORTS MACHINE LEARNING</text><text x="52" y="124" fill="white" font-family="Georgia,serif" font-size="56">Start with Duke.</text><text x="52" y="187" fill="white" font-family="Georgia,serif" font-size="56">Question every probability.</text><text x="55" y="231" fill="#cbdcf7" font-family="system-ui,sans-serif" font-size="19">Matchup scenarios. Every bracket path. Evidence behind the number.</text><rect x="54" y="260" width="257" height="43" rx="7" fill="#2e62e8"/><text x="74" y="287" fill="white" font-family="system-ui,sans-serif" font-size="16">OPEN THE DUKE WORKBENCH →</text><text x="334" y="286" fill="#a9c0e4" font-family="system-ui,sans-serif" font-size="14">Real schools · Synthetic scenarios · Runs offline</text><path d="M52 329h1176" stroke="#466795"/><g font-family="system-ui,sans-serif"><text x="55" y="374" fill="white" font-size="29" font-weight="650">14,311</text><text x="55" y="402" fill="#b7cce9" font-size="15">research team-season profiles</text><text x="428" y="374" fill="white" font-size="29" font-weight="650">132,133</text><text x="428" y="402" fill="#b7cce9" font-size="15">research matchup probabilities</text><text x="820" y="374" fill="white" font-size="29" font-weight="650">Reproduce the public lab</text><text x="820" y="402" fill="#b7cce9" font-size="15">Private forecasting assets stay private</text></g></svg>