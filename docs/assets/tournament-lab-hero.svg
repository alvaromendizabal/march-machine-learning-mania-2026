<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="600" viewBox="0 0 1320 600" role="img" aria-labelledby="title description">
  <title id="title">Tournament Lab — eight teams, every possible path</title>
  <desc id="description">An original vector illustration of an eight-team bracket. Fictional team cards converge through semifinal and final distributions. No winner or performance result is asserted. The accompanying browser demo computes exact probabilities from editable rating assumptions.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#32485e" stroke-width=".6"/></pattern>
  </defs>
  <rect width="1320" height="600" rx="16" fill="#f5f1e7"/>
  <path d="M16 0h1288a16 16 0 0 1 16 16v69H0V16A16 16 0 0 1 16 0" fill="#fffdf7"/>
  <path d="M40 85H1280" stroke="#d2d3cd"/>
  <g fill="#1d2e42" font-family="Arial,Helvetica,sans-serif">
    <text x="44" y="48" font-size="17" letter-spacing="2.4" font-weight="700">TOURNAMENT LAB</text>
    <text x="1276" y="47" text-anchor="end" font-size="13" letter-spacing="1.1">ALVARO MENDIZABAL / PROBABILISTIC ML</text>
    <text x="46" y="146" fill="#ad4c24" font-size="13" letter-spacing="1.5">ASSUMPTIONS YOU CAN INSPECT</text>
    <g font-family="Georgia,serif" font-size="43">
      <text x="43" y="209">Eight teams.</text>
      <text x="43" y="263">Every possible path.</text>
    </g>
    <g font-size="17" fill="#5c6671">
      <text x="46" y="309">Change a rating. Adjust uncertainty.</text>
      <text x="46" y="336">See how the whole bracket responds.</text>
    </g>
    <rect x="45" y="375" width="318" height="53" rx="4" fill="#172a40"/>
    <text x="66" y="408" font-size="16" fill="#fff5e4">Ratings → probabilities → paths</text>
    <g font-size="14" fill="#5c6671">
      <text x="46" y="466">Fictional teams · No training</text>
      <text x="46" y="490">Exact calculation under explicit assumptions</text>
    </g>
  </g>
  <rect x="499" y="117" width="777" height="411" rx="8" fill="#172a40"/>
  <rect x="499" y="117" width="777" height="411" rx="8" fill="url(#grid)" opacity=".55"/>
